# Добавьте в server {} публичного nginx (тот, что обслуживает HTTPS-домен).
# nginx-контейнер должен быть подключён к сети claude-net:
#   docker network connect claude-net <nginx-container>
location /devbot/webhook {
    proxy_pass http://claudeservice-devbot-1:3002/webhook;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
