# ClaudeService — центральный сервис (devbot + Redis), рядом с проектами.
# Postgres не используется: весь стейт в Redis.
# Публичный nginx (в стеке проекта) проксирует /devbot/webhook в devbot по сети claude-net.
#   docker network create claude-net   # разово
#   docker compose up -d --build
services:
  redis:
    # Redis 8: формат RDB совместим с 7-й, состояние бота переносится как есть.
    image: redis:8.10-alpine
    container_name: claudeservice-redis-1
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [claude-net]

  devbot:
    build: ./devbot
    container_name: claudeservice-devbot-1
    restart: unless-stopped
    # .env НЕ через env_file (снимок при создании), а bind-mount каталогом:
    # config.js перечитывает токен/админа/webhook из /cs-root/.env на лету,
    # поэтому смена значений в .env НЕ требует пересоздания контейнера.
    # Redis — статикой (соединение живёт с запуска, на лету не переключить).
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CS_ENV_FILE: /cs-root/.env
    depends_on: [redis]
    volumes:
      - ./:/cs-root:ro
      - /tmp/devbot-attachments:/attachments
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [claude-net]

  # Свой сервер Telegram Bot API — глобальный для ботов этого сервера. Нужен
  # тем, кому мало 50 МБ на файл от бота: в локальном режиме (TELEGRAM_LOCAL)
  # он принимает файлы до 2000 МБ. Живёт здесь, а не в проекте: ботов на
  # сервере несколько, сервер Bot API может быть один, а его ключи
  # (my.telegram.org) — рядом с остальными ключами Telegram в .env.
  # Проекты обращаются по полному имени: http://claudeservice-telegram-bot-api-1:8081
  # (короткие имена в общих сетях однажды указали на два разных сервера).
  # Сеть shared-data — потому что там живут воркеры проектов.
  # Профиль bot-api: без ключей сервер уходит в перезапуски, а на машине без
  # shared-data обычный `docker compose up` не должен ломаться. Запуск:
  #   docker compose --profile bot-api up -d telegram-bot-api
  # Бот переезжает на него после logOut у облачного Bot API — см. README.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.3
    container_name: claudeservice-telegram-bot-api-1
    profiles: [bot-api]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    networks: [claude-net, shared-data]

volumes:
  redis_data:
  telegram_bot_api_data:

networks:
  claude-net:
    external: true
  # Общая сеть слоя ClaudeDocker: в ней воркеры проектов. Нужна только
  # серверу Bot API (профиль bot-api).
  shared-data:
    external: true
